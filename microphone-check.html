<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>麦克风自检 · Norsk</title>
<style>
  :root{font:16px/1.6 system-ui,sans-serif;color:#18322c;background:#f2f6f3;color-scheme:light}
  body{max-width:680px;margin:32px auto;padding:0 20px}h1{font-size:27px}section{padding:24px;background:white;border:1px solid #d6e3da;border-radius:16px;margin:16px 0}
  button{font:inherit;border:0;border-radius:9px;background:#14614a;color:white;padding:12px 18px;margin:4px 4px 4px 0;cursor:pointer}button:disabled{opacity:.45;cursor:default}
  button.secondary{color:#18322c;background:#e8f0ec}meter{display:block;width:100%;height:28px;margin:16px 0}pre{overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.6 monospace}
  small{color:#506b60}#status{font-weight:600}.facts{white-space:pre-line}a{color:#14614a}
</style>
<body>
<a href="./">← 返回学习网站</a>
<h1>麦克风自检</h1>
<p>本页使用网站的正式录音模块。音频只用于本机音量显示，不保存、不上传。</p>
<section>
  <p id="status" role="status" aria-live="polite">正在载入检测模块…</p>
  <button id="start" disabled>开始检测</button><button id="stop" class="secondary" disabled>停止</button>
  <meter id="level" aria-label="麦克风音量" min="0" max="1" value="0"></meter>
  <p id="frames">尚未收到音频</p>
  <small>允许麦克风后，说几句话。音量条应随声音变化；收到音频帧并不单独证明声音正常。切到后台会停止检测，回到本页后可再次开始。</small>
</section>
<section>
  <strong>检测信息</strong><p id="environment" class="facts"></p>
  <button id="save" class="secondary" disabled>保存诊断记录</button>
  <details><summary>查看诊断记录（不含录音）</summary><pre id="details"></pre></details>
</section>
<small>版本 20261115-local-reading · 请通过 HTTPS 打开本页。</small>
<script type="module">
const $=id=>document.getElementById(id),version='20261115-local-reading';
let module,controller,input,request,frames=0,peak=0,refresh,lastError=null;
const environment={secure:window.isSecureContext,capture:!!navigator.mediaDevices?.getUserMedia,
  audioContext:!!(window.AudioContext||window.webkitAudioContext),audioSession:!!navigator.audioSession};
$('environment').textContent=`HTTPS 安全环境：${environment.secure?'是':'否'}\n麦克风接口：${environment.capture?'可用':'不可用'}\n音频接口：${environment.audioContext?'可用':'不可用'}`;
function record(){return {version,at:new Date().toISOString(),environment,frames,peak,lastError,microphone:controller?.diagnostics()};}
function show(){ $('details').textContent=JSON.stringify(record(),null,2); }
function stop(){
  request?.abort();request=null;input?.close();input=null;clearInterval(refresh);
  $('start').disabled=!module;$('stop').disabled=true;$('level').value=0;show();
}
function failed(error){lastError={code:error.code||'load',reason:error.reason||error.name,stage:error.stage||'load'};
  stop();$('status').textContent=module?module.micMessage(error):'检测模块未能载入，请检查网络后刷新页面。';}
$('start').onclick=async()=>{
  if(request)return;
  const own=request=new AbortController();frames=0;peak=0;lastError=null;
  $('start').disabled=true;$('stop').disabled=false;$('status').textContent='请处理浏览器的麦克风询问…';
  try{
    // Reproduce the important transition: playback mode -> protected microphone permission request.
    controller.playback();
    const opened=await module.openInput({signal:own.signal,onError:failed});
    if(request!==own){opened.close();return;}input=opened;
    opened.listen(block=>{let sum=0;for(const value of block)sum+=value*value;
      const rms=Math.sqrt(sum/Math.max(1,block.length));frames++;peak=Math.max(peak,rms);$('level').value=Math.min(1,rms*8);});
    $('status').textContent='麦克风已连接，请说话并观察音量条。';
    refresh=setInterval(()=>{$('frames').textContent=`已收到 ${frames} 个音频块，采样率 ${opened.context.sampleRate} Hz`;show();},250);
  }catch(error){if(request===own)failed(error);}
};
$('stop').onclick=()=>{stop();$('status').textContent='检测已停止，可以再次开始。';};
$('save').onclick=()=>{
  const url=URL.createObjectURL(new Blob([JSON.stringify(record(),null,2)],{type:'application/json'}));
  const link=document.createElement('a');link.href=url;link.download='norsk-microphone-diagnostics.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
};
window.addEventListener('pagehide',stop);
document.addEventListener('visibilitychange',()=>{if(document.hidden){stop();$('status').textContent='页面已切到后台。回来后请再次开始检测。';}});
try{module=await import(`./microphone.mjs?v=${version}`);controller=module.microphoneController();$('start').disabled=false;$('save').disabled=false;
  $('status').textContent='点击开始检测，允许麦克风后说几句话。';show();}catch(error){failed(error);}
</script>
</body>
</html>
